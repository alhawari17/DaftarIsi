const rerender=()=>{const y=$('#view').scrollTop,g0=$('#gal'),sl=g0?g0.scrollLeft:0;go(cur,false);$('#view').scrollTop=y;const g=$('#gal');if(g&&sl)g.scrollLeft=sl};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-back],[data-claim],[data-cart],[data-wish],[data-cat],[data-toast],[data-rm],[data-like],[data-ftab],[data-setmain],[data-deladdr],[data-dtab],[data-q],[data-pay],[data-pickv],[data-rcat],[data-efav],[data-vsel],[data-vm],[data-closevm],[data-jml],[data-addc],[data-gal],[data-more],[data-coin]');if(!t)return;
  if(t.dataset.back!==undefined){S.cat='Semua';S.vm=false;S.dcur=null;go(hist.pop()||'home',false)}
  else if(t.dataset.go){S.cat='Semua';S.dtab='Ringkasan';S.more=false;S.dcur=null;S.vm=false;const g=t.dataset.go;if(NAV.some(x=>x[0]===g))hist.length=0;go(g,!NAV.some(x=>x[0]===g))}
  else if(t.dataset.claim){const id=t.dataset.claim;if(S.claimed.has(id))toast('Voucher sudah kamu klaim');else{S.claimed.add(id);toast('Voucher berhasil diklaim')}rerender()}
  else if(t.dataset.cart){S.cart.add(+t.dataset.cart);toast('Masuk ke keranjang');rerender()}
  else if(t.dataset.wish){const k=+t.dataset.wish;S.wish.has(k)?S.wish.delete(k):S.wish.add(k);rerender()}
  else if(t.dataset.cat){S.cat=t.dataset.cat;rerender()}
  else if(t.dataset.vsel){S.vsel=+t.dataset.vsel;rerender();const g=$('#gal');if(g)g.scrollLeft=g.clientWidth*(NB+S.vsel)}
  else if(t.hasAttribute('data-vm')){S.vm=true;rerender()}else if(t.hasAttribute('data-closevm')){S.vm=false;rerender()}
  else if(t.dataset.jml){S.jml=Math.min(99,Math.max(1,S.jml+(+t.dataset.jml)));rerender()}
  else if(t.dataset.addc){const id=+t.dataset.addc,b=B.find(x=>x.id===id),had=S.cart.has(id);S.cart.add(id);S.pv[id]=S.vsel;S.qty[id]=b.e?1:S.jml;S.vm=false;toast(had?'Keranjang diperbarui':'Masuk ke keranjang');rerender()}
  else if(t.dataset.gal){const g=$('#gal');if(g)g.scrollBy({left:+t.dataset.gal*g.clientWidth,behavior:'smooth'})}
  else if(t.dataset.rcat){S.rcat=t.dataset.rcat;rerender()}else if(t.dataset.efav){const k=+t.dataset.efav;S.efav.has(k)?S.efav.delete(k):S.efav.add(k);rerender()}else if(t.hasAttribute('data-more')){S.more=!S.more;rerender()}else if(t.dataset.pickv){const id=t.dataset.pickv;if(S.vs.includes(id)){S.vs=S.vs.filter(x=>x!==id);toast('Voucher dilepas')}else{const m=setV(id);toast(m||'Voucher dipakai')}rerender()}else if(t.hasAttribute('data-coin')){S.useCoin=!S.useCoin;rerender()}else if(t.dataset.q){const [i,d]=t.dataset.q.split(',').map(Number);S.qty[i]=Math.min(99,Math.max(1,(S.qty[i]||1)+d));rerender()}else if(t.dataset.pay){S.pay=PAY[+t.dataset.pay];toast('Metode pembayaran dipilih');go(hist.pop()||'cart',false)}else if(t.dataset.dtab){S.dtab=t.dataset.dtab;rerender()}else if(t.dataset.setmain){S.addr.forEach(a=>a.m=a.id==t.dataset.setmain);toast('Alamat utama diperbarui');rerender()}else if(t.dataset.deladdr){S.addr=S.addr.filter(a=>a.id!=t.dataset.deladdr);toast('Alamat dihapus');rerender()}else if(t.dataset.rm){S.cart.delete(+t.dataset.rm);delete S.qty[+t.dataset.rm];toast('Dihapus dari keranjang');rerender()}else if(t.dataset.like){const k=+t.dataset.like;S.likes.has(k)?S.likes.delete(k):S.likes.add(k);rerender()}else if(t.dataset.ftab){S.ftab=t.dataset.ftab;rerender()}
  else if(t.dataset.toast)toast(t.dataset.toast);
});
document.addEventListener('scroll',e=>{const g=e.target;if(g&&g.id==='gal'){const c=$('#gcnt');if(c)c.textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+'/'+g.children.length}},true);
let sx=0,sc=null,dx=0;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.cc');if(!c||e.target.closest('button'))return;sc=c.parentElement;sx=e.clientX;dx=0});
document.addEventListener('pointermove',e=>{if(sc)dx=e.clientX-sx});
document.addEventListener('pointercancel',()=>{sc=null});
document.addEventListener('pointerup',()=>{if(!sc)return;if(dx<-40){document.querySelectorAll('.ci.open').forEach(x=>x.classList.remove('open'));sc.classList.add('open')}else if(dx>40)sc.classList.remove('open');sc=null});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();
  if(f.matches('[data-search]')){S.q=f.q.value.trim();S.cat='Semua';cur==='cari'?rerender():go('cari')}
  else if(f.matches('[data-chat]')){const v=f.m.value.trim();if(!v)return;S.chat.push({u:1,t:v.replace(/</g,'&lt;')});rerender();$('#view').scrollTop=1e5;$('[name=m]').focus();
    setTimeout(()=>{S.chat.push({u:0,t:'Terima kasih, pesanmu sudah kami teruskan ke penjual.'});if(cur==='chat'){rerender();$('#view').scrollTop=1e5;$('[name=m]').focus()}},900)}
  else if(f.matches('[data-prof]')){S.name=f.n.value.trim()||S.name;S.u.bio=f.bio.value.trim();S.u.g=f.g.value;S.u.d=f.d.value;toast('Profil disimpan');go(hist.pop()||'profil',false)}
  else if(f.matches('[data-fld]')){S.u[f.dataset.fld]=f.v.value.trim();toast('Data disimpan');go(hist.pop()||'akun',false)}
  else if(f.matches('[data-vc]')){const code=f.c.value.trim().toUpperCase(),id=Object.keys(VR).find(k=>VR[k].code===code);if(!code){toast('Masukkan kode voucher');return}if(!id){toast('Kode voucher tidak ditemukan');return}if(S.vs.includes(id)){toast('Voucher sudah dipakai');return}const m=setV(id);toast(m||'Voucher berhasil dipakai');rerender()}
  else if(f.matches('[data-book]')){S.bk[f.dataset.id]={n:f.n.value.trim(),h:f.h.value.trim(),e:f.e.value.trim(),k:f.k.value};toast('Booking berhasil');go(hist.pop()||'event',false)}
  else if(f.matches('[data-pw]')){if(f.p.value!==f.q.value){toast('Konfirmasi password tidak sama');return}toast('Password diperbarui');go(hist.pop()||'akun',false)}
  else if(f.matches('[data-addr]')){const old=S.addr.find(x=>x.id==f.dataset.id),m=f.m.checked||!!(old&&old.m)||!S.addr.length;if(m)S.addr.forEach(x=>x.m=false);const d={l:f.l.value,n:f.n.value.trim(),h:f.h.value.trim(),a:f.a.value.trim(),m};if(old)Object.assign(old,d);else S.addr.push({id:Date.now(),...d});toast(old?'Alamat disimpan':'Alamat ditambahkan');go(hist.pop()||'alamat',false)}});
document.addEventListener('change',e=>{if(e.target.id!=='pf'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{S.photo=r.result;$('#pv').innerHTML=`<img src="${S.photo}" alt="">`};r.readAsDataURL(e.target.files[0])});
go('home',false);
</script>
</body>
</html>
