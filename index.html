<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftar Isi – Toko Buku Online</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#4a55d9;--p2:#6b4fd8;--pl:#e9ebff;--ink:#1f2340;--mut:#7a7f9d;--bg:#fff9f3;--card:#fff;--ok:#1fa971;--acc:#ff7a59}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{width:100%;height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;overflow-y:auto;padding-bottom:96px;scroll-behavior:smooth}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 46px;border-radius:0 0 0 0}
.top h1{font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px}
.top p{font-size:13px;opacity:.85;margin-top:2px}
.back{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:18px}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-28px;padding:18px 16px 8px;position:relative}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:30px;padding:4px 6px 4px 16px;box-shadow:0 4px 14px rgba(74,85,217,.15)}
.search input{flex:1;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);padding:10px 0;min-width:0}
.search button{width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff}
.slider{position:relative;margin:14px 0 4px;border-radius:20px;overflow:hidden}
.slides{display:flex;transition:transform .5s}
.slide{min-width:100%;height:clamp(170px,26vw,260px);padding:20px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px}
.slide h2{font-size:20px;line-height:1.25;max-width:70%}
.slide p{font-size:12px;opacity:.9;max-width:70%}
.slide .pill{margin-top:6px;background:#fff;color:var(--p);font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px}
.slide .big{position:absolute;right:18px;font-size:70px}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}.dots i.on{background:#fff;width:18px;border-radius:6px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:500;text-align:center}
.cat span{width:100%;max-width:64px;aspect-ratio:1;border-radius:50%;background:var(--pl);display:grid;place-items:center;font-size:26px}
.cat:active span{transform:scale(.94)}
.vl{display:grid;gap:12px;margin-bottom:6px}.vl .vc{width:100%}
.tr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ib{position:relative;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.ib svg,.cat span svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat span svg{width:26px;height:26px;stroke:var(--p)}
.badge{position:absolute;top:-3px;right:-3px;background:#ff7a59;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.av{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;font-weight:700;font-size:20px;overflow:hidden;border:2px solid rgba(255,255,255,.6);flex:none}
.av img{width:100%;height:100%;object-fit:cover}.av.sm{width:40px;height:40px;font-size:15px;color:#fff;border:0}
.post{display:flex;gap:10px;padding:14px 4px;border-bottom:1px solid rgba(122,127,157,.2)}.pb{flex:1;min-width:0}
.pb b{font-size:13px}.mut{font-size:11px;color:var(--mut)}.pb p{font-size:13px;line-height:1.55;margin:4px 0 8px}
.media{border-radius:16px;aspect-ratio:16/9;display:grid;place-items:center;font-size:54px;position:relative;overflow:hidden;margin-bottom:8px}
.play{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:20px}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 7px;border-radius:8px}
.act{display:flex;gap:22px;font-size:12px;color:var(--mut)}.act button{color:inherit;font-size:12px}.act .lk{color:#e0407b}
.msg{max-width:78%;padding:10px 14px;border-radius:18px;font-size:13px;margin-bottom:8px;background:var(--card);line-height:1.5}
.msg.u{background:var(--p);color:#fff;margin-left:auto}
.rv{min-width:240px;scroll-snap-align:start;background:var(--card);border-radius:18px;padding:14px;font-size:12px;line-height:1.55}
.rv .st{color:#ffb400;letter-spacing:2px;font-size:13px}.rv .who{display:flex;gap:10px;align-items:center;margin-bottom:6px}.rv small{color:var(--mut)}
.inp{width:100%;border:1.5px solid var(--pl);background:var(--card);border-radius:14px;padding:12px;font:inherit;font-size:14px;color:var(--ink);margin:6px 0 12px}
.kc{min-width:150px;flex:1;scroll-snap-align:start;border-radius:20px;padding:14px;color:#fff;text-align:left;position:relative;overflow:hidden;height:150px;display:flex;flex-direction:column}
.kc small{font-size:11px;opacity:.85}.kc b{font-size:19px;line-height:1.15;margin-top:4px}.kc i{font-style:normal;font-size:11px;margin-top:auto;opacity:.95}
.kc .ic{position:absolute;right:8px;bottom:2px;font-size:54px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.kcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px}
.banner{width:100%;text-align:left;border-radius:18px;padding:18px;background:linear-gradient(120deg,#ff7a59,#ffa26b);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner b{font-size:16px;line-height:1.3;display:block}.banner small{font-size:11px;opacity:.9}
.banner em{font-style:normal;background:#fff;color:#e2552f;border-radius:14px;padding:6px 12px;font-size:11px;font-weight:600;white-space:nowrap}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sh h3{font-size:15px;font-weight:600}.sh button{font-size:12px;color:var(--p);font-weight:500}
.hs{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.vc{min-width:230px;scroll-snap-align:start;border-radius:18px;padding:14px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.vc b{font-size:18px}.vc small{font-size:11px;opacity:.9}.vc .cl{margin-top:8px;align-self:flex-start;background:#fff;color:var(--ink);padding:5px 12px;border-radius:14px;font-size:11px;font-weight:600}
.vc.done .cl{background:rgba(255,255,255,.3);color:#fff}
.vc .ic{position:absolute;right:10px;top:6px;font-size:40px;opacity:.9}
.bk{min-width:112px;width:112px;scroll-snap-align:start;text-align:left}
.grid .bk{width:auto;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cover{aspect-ratio:2/3;border-radius:12px;padding:10px 8px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 16px rgba(31,35,64,.25);position:relative;overflow:hidden}
.cover b{font-size:12px;line-height:1.2;font-weight:700}.cover small{font-size:9px;opacity:.85}
.cover:after{content:"";position:absolute;right:-20px;bottom:-20px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.15)}
.tag{position:absolute;top:8px;left:0;background:#ffc93c;color:#3a2b00;font-size:9px;font-weight:700;padding:2px 7px;border-radius:0 8px 8px 0;z-index:1}
.audio{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.35);font-size:9px;padding:2px 6px;border-radius:8px;z-index:1}
.bk h4{font-size:12px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk p{font-size:10px;color:var(--mut)}.bk .pr{font-size:12px;font-weight:600;color:var(--p);margin-top:2px}.bk .pr s{color:var(--mut);font-weight:400;font-size:10px;margin-right:4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;border:1.5px solid var(--p);color:var(--p);font-size:12px;font-weight:500}
.chip.on{background:var(--p);color:#fff}
.row{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;text-align:left;width:100%;align-items:center}
.row .th{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--pl);flex:none}
.row b{font-size:13px;display:block}.row small{font-size:11px;color:var(--mut)}
.row .go{margin-left:auto;color:var(--p);font-weight:600;font-size:12px;white-space:nowrap}
.det{display:flex;gap:16px;padding:0 16px}.det .cover{width:120px;flex:none}
.hero{display:flex;gap:16px;align-items:flex-end}.hero .cover{width:110px;flex:none;margin-top:-6px}
.btn{display:block;width:100%;background:var(--p);color:#fff;font-weight:600;font-size:14px;padding:13px;border-radius:30px;margin-top:10px;text-align:center}
.btn.alt{background:var(--pl);color:var(--p)}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:30px 10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat div{background:var(--card);border-radius:16px;padding:12px;text-align:center}.stat b{font-size:20px;display:block;color:var(--p)}.stat small{font-size:10px;color:var(--mut)}
nav{position:absolute;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:560px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--card);border-radius:30px;box-shadow:0 10px 30px rgba(31,35,64,.28);display:flex;justify-content:space-around;padding:8px 6px;z-index:5}
nav button{display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:24px;color:var(--mut);font-size:10px;font-weight:600;flex-direction:column;min-width:54px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--p);color:#fff}
#toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:.3s;z-index:9;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.slider{margin:14px auto 4px;max-width:760px}
.slide{padding:0;height:auto;aspect-ratio:12/5;display:block}.slide img{width:100%;height:100%;object-fit:cover;display:block}
.pbn{display:block;width:100%;max-width:760px;margin:0 auto;border-radius:18px;overflow:hidden}.pbn img{width:100%;display:block}
.kc .ic{filter:none;bottom:12px;right:12px}.kc .ic svg{width:62px;height:62px;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.chatbar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:560px;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:4}
.row .th svg{width:26px;height:26px;fill:none;stroke:var(--p);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cover{padding-top:34px}
.adm{background:var(--pl);color:var(--p);font-size:9px;padding:1px 7px;border-radius:8px;font-weight:600;margin-left:4px;vertical-align:1px}
</style>
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <nav aria-label="Menu utama"></nav>
  <div id="toast" role="status"></div>
</div>

  <div class="slider"><div class="slides" id="sl">${sl.map(x=>`<button class="slide" data-go="${x[1]}"><img src="${x[2]}" alt="${x[0]}"></button>`).join('')}</div><div class="dots">${sl.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div></div>
  <div class="cats">${[['flashsale','bolt','Flash Sale'],['promo','tag','Promo'],['member','crown','Member'],['voucher','ticket','Voucher'],['semua','grid','Lihat Semua']].map(c=>`<button class="cat" data-go="${c[0]}"><span>${svg(c[1])}</span>${c[2]}</button>`).join('')}</div>
  <div class="kcs">${KC.map(k=>`<button class="kc" style="background:${k[4]}" data-go="${k[0]}"><small>${k[3]}</small><b>${k[1]}</b><i>${k[5]}</i><span class="ic">${svg(k[2])}</span></button>`).join('')}</div><br>
  <button class="pbn" data-go="promo"><img src="${IMG.d}" alt="Promo Hari Ini, hemat hingga 30%"></button>
  ${sec('Klaim Voucher','promo',`<div class="hs">${V.map(voucherCard).join('')}</div>`)}
  ${sec('Buku Populer','pesan',`<div class="hs">${B.filter(b=>!b.e).slice(0,10).map(card).join('')}</div>`)}
  ${sec('E-Book Populer','ebook',`<div class="hs">${B.filter(b=>b.e).slice(0,10).map(card).join('')}</div>`)}
  ${sec('Review Pelanggan',0,`<div class="hs">${R.map(r=>`<div class="rv"><div class="who"><span class="av sm" style="background:var(--p)">${r[0][0]}</span><span><b>${r[0]}</b><br><small>${r[1]}</small></span></div><div class="st">★★★★★</div>${r[2]}</div>`).join('')}</div>`)}`)},
pesan(){const cats=['Semua','Novel','Pengembangan Diri','Horor','Anak','Referensi','Masakan','Bisnis'],l=B.filter(b=>!b.e&&(S.cat==='Semua'||b.g===S.cat));
  return head('Pesan Online','Buku cetak dikirim ke rumahmu',1)+sheet(`${searchBox()}<div class="chips">${cats.map(c=>`<button class="chip ${S.cat===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>${sec(S.cat==='Semua'?'Semua buku cetak':S.cat,0,l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p class="empty">Belum ada buku di genre ini.</p>')}`)},
ebook(){return head('E-Book','Rak digitalmu, di mana saja',1)+sheet(`${searchBox()}<div class="chips">${['Recommended','Terbaru','Gratis','Koleksi'].map((c,i)=>`<button class="chip ${i?'':'on'}" data-toast="Filter ${c} dipilih">${c}</button>`).join('')}</div>${sec('Pilihan untukmu',0,`<div class="grid">${B.filter(b=>b.e).map(card).join('')}</div>`)}`)},
pameran(){const st=[['🏛️','Stan Penerbit Nusantara','24 judul · buka hari ini'],['🎨','Galeri Buku Desain','18 judul · buka hari ini'],['📜','Lorong Sejarah','31 judul · tutup 21.00'],['🧸','Pojok Anak','40 judul · buka hari ini']];
  return head('Pameran Buku','Jalan-jalan di stan online',1)+sheet(`${sec('Stan pilihan',0,st.map(s=>`<button class="row" data-go="pesan"><span class="th">${s[0]}</span><span><b>${s[1]}</b><small>${s[2]}</small></span><span class="go">Masuk</span></button>`).join(''))}`)},
event(){const ev=[['🎤','Bedah Buku: Laut Bercerita','Sab, 22 Nov · 19.00 · Online'],['✍️','Workshop Menulis Cerpen','Min, 23 Nov · 10.00 · Online'],['📖','Klub Baca Bulanan','Sab, 29 Nov · 16.00 · Online'],['🤝','Temu Penulis','Min, 7 Des · 14.00 · Online']];
  return head('Event','Diskusi, workshop, dan temu penulis',1)+sheet(ev.map(e=>`<button class="row" data-toast="Kamu terdaftar di “${e[1]}”"><span class="th">${e[0]}</span><span><b>${e[1]}</b><small>${e[2]}</small></span><span class="go">Daftar</span></button>`).join(''))},
explore(){const t=S.ftab,l=F.map((f,i)=>[f,i]).filter(x=>t==='Untuk Kamu'||String(x[0][0])===t),gr=['#6a5cff,#ff7eb0','#1fb5a3,#4361ee','#3a86ff,#8338ec','#ff7a1a,#ffd166','#4a55d9,#8338ec'];
  return head('Explore','Update resmi dari admin Daftar Isi',0)+sheet(`<div class="chips">${[['Untuk Kamu','Untuk Kamu'],...ADM.map((a,i)=>[String(i),a[0].replace('&','&amp;')])].map(c=>`<button class="chip ${t===c[0]?'on':''}" data-ftab="${c[0]}">${c[1]}</button>`).join('')}</div>${l.map(([f,i])=>{const a=ADM[f[0]],lk=S.likes.has(i);return `<article class="post"><span class="av sm" style="background:${a[2]}">${a[0][0]}</span><div class="pb"><b>${a[0].replace('&','&amp;')}</b><span class="adm">Admin</span> <span class="mut">@${a[1]} · ${i+1}j</span><p>${f[1]}</p>${f[4]==='text'?'':`<div class="media" style="background:linear-gradient(135deg,${gr[f[0]]})">${a[3]}${f[4]==='video'?'<button class="play" data-toast="Memutar video…" aria-label="Putar video">▶</button><span class="dur">0:'+(30+i*7)+'</span>':''}</div>`}<div class="act"><button class="${lk?'lk':''}" data-like="${i}">${lk?'♥':'♡'} ${f[2]+(lk?1:0)}</button><span>💬 ${f[3]}</span><button data-toast="Tautan disalin">↗ Bagikan</button></div></div></article>`}).join('')}`)},
cari(){const q=S.q.toLowerCase(),r=B.filter(b=>!q||(b.t+b.a).toLowerCase().includes(q));
  return head('Pencarian',q?`Hasil untuk “${S.q}”`:'Cari bacaan baru',1)+sheet(`${searchBox()}<div class="chips">${['Semua','Cetak','E-Book'].map(c=>`<button class="chip ${S.cat===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div><br>${(()=>{const l=r.filter(b=>S.cat==='Semua'||(S.cat==='E-Book')===b.e);return l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p class="empty">Buku tidak ditemukan. Coba kata kunci lain.</p>'})()}`)},
flashsale(){return head('Flash Sale','Diskon kilat, stok terbatas',1)+sheet(`<div class="banner" style="cursor:default"><span><b>Berakhir hari ini ⚡</b><small>Buku diskon 20% ke atas</small></span></div>${sec('Sedang diskon',0,`<div class="grid">${B.filter(b=>b.d>=20).map(card).join('')}</div>`)}`)},
member(){const m=[['🥉','Bronze','Gratis · poin 1x'],['🥈','Silver','Belanja Rp500rb · poin 2x'],['🥇','Gold','Belanja Rp1,5jt · poin 3x + gratis ongkir']];
  return head('Member','Kumpulkan poin, tukar hadiah',1)+sheet(`${m.map(x=>`<button class="row" data-toast="Level ${x[1]} dipilih"><span class="th">${x[0]}</span><span><b>${x[1]}</b><small>${x[2]}</small></span><span class="go">Detail</span></button>`).join('')}<button class="btn" data-toast="Pendaftaran member segera hadir">Daftar jadi member</button>`)},
voucher(){return head('Voucher','Klaim sebelum kehabisan',1)+sheet(vlist())},
semua(){const m=[['bolt','Flash Sale','flashsale'],['tag','Promo','promo'],['crown','Member','member'],['ticket','Voucher','voucher'],['cart','Pesan Online','pesan'],['museum','Pameran Buku','pameran'],['book','E-Book','ebook'],['cal','Event','event']];
  return head('Semua Menu','Pilih yang kamu butuhkan',1)+sheet(m.map(x=>`<button class="row" data-go="${x[2]}"><span class="th">${svg(x[0])}</span><span><b>${x[1]}</b></span><span class="go">›</span></button>`).join(''))},
promo(){return head('Promo','Klaim voucher dan hemat belanja',0)+sheet(`${sec('Voucher untukmu','voucher',vlist())}${sec('Buku diskon',0,`<div class="grid">${B.filter(b=>b.d>=20).map(card).join('')}</div>`)}`)},
aktivitas(){const a=[['📦','Pesanan dalam pengiriman','Bumi Manusia · tiba 2 hari lagi'],['📱','E-book terunduh','Atomic Habits · siap dibaca'],['🎟️','Voucher akan berakhir','Gratis Ongkir · 3 hari lagi']];
  return head('Aktivitas','Pesanan, bacaan, dan notifikasi',0)+sheet(`<div class="stat"><div><b>${S.cart.size}</b><small>Keranjang</small></div><div><b>${S.wish.size}</b><small>Wishlist</small></div><div><b>${S.claimed.size}</b><small>Voucher</small></div></div><button class="row" data-go="chat"><span class="th">${svg('chat').replace('<svg','<svg style="width:26px;height:26px;fill:none;stroke:var(--p);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"')}</span><span><b>Chat Penjual</b><small>${S.chat[S.chat.length-1].t.slice(0,38)}</small></span><span class="go">Buka</span></button>${a.map(x=>`<button class="row" data-toast="${x[1]}"><span class="th">${x[0]}</span><span><b>${x[1]}</b><small>${x[2]}</small></span></button>`).join('')}`)},
profil(){return head(S.name,'Selamat datang kembali',0,avatar())+sheet(`<div class="stat"><div><b>${S.claimed.size}</b><small>Voucher</small></div><div><b>${S.wish.size}</b><small>Wishlist</small></div><div><b>0</b><small>Poin</small></div></div><button class="row" data-go="editprofil"><span><b>Edit profil</b></span><span class="go">›</span></button>${['Alamat pengiriman','Metode pembayaran','Bantuan'].map(x=>`<button class="row" data-toast="${x} segera hadir"><span><b>${x}</b></span><span class="go">›</span></button>`).join('')}<button class="btn alt" data-toast="Kamu keluar dari akun">Keluar</button>`)},
editprofil(){return head('Edit Profil','Ubah nama dan foto',1)+sheet(`<form data-prof><div style="display:flex;align-items:center;gap:14px"><span class="av" id="pv" style="background:var(--pl)">${S.photo?`<img src="${S.photo}" alt="">`:S.name[0].toUpperCase()}</span><label class="btn alt" style="margin:0;width:auto;padding:10px 18px;font-size:12px">Ganti foto<input type="file" id="pf" accept="image/*" hidden></label></div><label style="font-size:12px;color:var(--mut);display:block;margin-top:16px">Nama pengguna</label><input class="inp" name="n" value="${S.name}" maxlength="30" required><button class="btn">Simpan</button></form>`)},
cart(){const it=B.filter(b=>S.cart.has(b.id)),tot=it.reduce((x,b)=>x+b.p*(1-b.d/100),0);
  return head('Keranjang',it.length+' item',1)+sheet(it.length?it.map(b=>`<div class="row"><button style="display:contents" data-go="detail:${b.id}"><span class="th">${b.e?'📱':'📕'}</span><span><b>${b.t}</b><small>${rp(b.p*(1-b.d/100))}</small></span></button><button class="go" data-rm="${b.id}">Hapus</button></div>`).join('')+`<div class="row"><b>Total</b><span class="go" style="font-size:15px">${rp(tot)}</span></div><button class="btn" data-toast="Checkout segera hadir">Checkout</button>`:'<p class="empty">Keranjangmu masih kosong.</p><button class="btn" data-go="pesan">Mulai belanja</button>')},
chat(){return head('Chat Penjual','Biasanya membalas dalam beberapa menit',1)+sheet(`<div style="padding-bottom:80px">${S.chat.map(m=>`<div class="msg ${m.u?'u':''}">${m.t}</div>`).join('')}</div><form class="search chatbar" data-chat><input name="m" placeholder="Tulis pesan…" aria-label="Pesan" autocomplete="off"><button aria-label="Kirim">➤</button></form>`)},
detail(id){const b=B.find(x=>x.id==id);
  return head(b.t,b.a,1)+sheet(`<div class="hero">${cover(b)}<div><div class="pr" style="font-size:18px;font-weight:700;color:var(--p)">${rp(b.p*(1-b.d/100))}</div>${b.d?`<small style="color:var(--mut)"><s>${rp(b.p)}</s> · hemat ${b.d}%</small>`:''}<p style="font-size:12px;color:var(--mut);margin-top:6px">${b.e?'Format e-book · langsung terunduh':'Buku cetak · dikirim 2–4 hari'}</p></div></div>
  <div class="chips">${['Ringkasan','Detail'].map((c,i)=>`<button class="chip ${i?'':'on'}">${c}</button>`).join('')}</div>
  <p style="font-size:13px;line-height:1.7;color:var(--mut)">Ringkasan singkat ${b.t} oleh ${b.a}. Ganti teks ini dengan sinopsis asli dari data buku kamu.</p>
  <button class="btn" data-cart="${b.id}">${S.cart.has(b.id)?'Sudah di keranjang ✓':b.e?'Beli e-book':'Tambah ke keranjang'}</button>
  <button class="btn alt" data-wish="${b.id}">${S.wish.has(b.id)?'♥ Ada di wishlist':'♡ Simpan ke wishlist'}</button>`)}
};
function go(page,push=true){
  const [n,arg]=page.split(':');if(!P[n])return;
  if(push)hist.push(cur);cur=page;
  $('#view').innerHTML=P[n](arg);$('#view').scrollTop=n==='chat'?1e5:0;
  const act=NAV.map(x=>x[0]).includes(n)?n:({pesan:'home',ebook:'home',pameran:'home',event:'home',flashsale:'home',member:'home',semua:'home',voucher:'promo',detail:'home',cari:'home',cart:'home',chat:'aktivitas',editprofil:'profil'})[n];
  $('nav').innerHTML=NAV.map(x=>`<button data-go="${x[0]}" class="${x[0]===act?'on':''}" aria-label="${x[1]}"><svg viewBox="0 0 24 24">${x[2]}</svg>${x[1]}</button>`).join('');
  clearInterval(tmr);if(n==='home')slider();
}
function slider(){let i=0;const s=$('#sl');if(!s)return;tmr=setInterval(()=>{i=(i+1)%3;s.style.transform=`translateX(-${i*100}%)`;document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===i))},3500)}
const rerender=()=>{const y=$('#view').scrollTop;go(cur,false);$('#view').scrollTop=y};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-back],[data-claim],[data-cart],[data-wish],[data-cat],[data-toast],[data-rm],[data-like],[data-ftab]');if(!t)return;
  if(t.dataset.back!==undefined){S.cat='Semua';go(hist.pop()||'home',false)}
  else if(t.dataset.go){S.cat='Semua';const g=t.dataset.go;if(NAV.some(x=>x[0]===g))hist.length=0;go(g,!NAV.some(x=>x[0]===g))}
  else if(t.dataset.claim){const id=t.dataset.claim;if(S.claimed.has(id))toast('Voucher sudah kamu klaim');else{S.claimed.add(id);toast('Voucher berhasil diklaim')}rerender()}
  else if(t.dataset.cart){S.cart.add(+t.dataset.cart);toast('Masuk ke keranjang');rerender()}
  else if(t.dataset.wish){const k=+t.dataset.wish;S.wish.has(k)?S.wish.delete(k):S.wish.add(k);rerender()}
  else if(t.dataset.cat){S.cat=t.dataset.cat;rerender()}
  else if(t.dataset.rm){S.cart.delete(+t.dataset.rm);rerender()}else if(t.dataset.like){const k=+t.dataset.like;S.likes.has(k)?S.likes.delete(k):S.likes.add(k);rerender()}else if(t.dataset.ftab){S.ftab=t.dataset.ftab;rerender()}
  else if(t.dataset.toast)toast(t.dataset.toast);
});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();
  if(f.matches('[data-search]')){S.q=f.q.value.trim();S.cat='Semua';cur==='cari'?rerender():go('cari')}
  else if(f.matches('[data-chat]')){const v=f.m.value.trim();if(!v)return;S.chat.push({u:1,t:v.replace(/</g,'&lt;')});rerender();$('#view').scrollTop=1e5;$('[name=m]').focus();
    setTimeout(()=>{S.chat.push({u:0,t:'Terima kasih, pesanmu sudah kami teruskan ke penjual.'});if(cur==='chat'){rerender();$('#view').scrollTop=1e5;$('[name=m]').focus()}},900)}
  else if(f.matches('[data-prof]')){S.name=f.n.value.trim()||S.name;toast('Profil disimpan');hist.pop();go('profil',false)}});
document.addEventListener('change',e=>{if(e.target.id!=='pf'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{S.photo=r.result;$('#pv').innerHTML=`<img src="${S.photo}" alt="">`};r.readAsDataURL(e.target.files[0])});
go('home',false);
</script>
</body>
</html>
