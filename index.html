  else if(t.dataset.gal){const g=$('#gal');if(g)g.scrollBy({left:+t.dataset.gal*g.clientWidth,behavior:'smooth'})}
  else if(t.dataset.rcat){S.rcat=t.dataset.rcat;rerender()}else if(t.dataset.efav){const k=+t.dataset.efav;S.efav.has(k)?S.efav.delete(k):S.efav.add(k);rerender()}else if(t.hasAttribute('data-more')){S.more=!S.more;rerender()}else if(t.dataset.pickv){const id=t.dataset.pickv;if(S.vs.includes(id)){S.vs=S.vs.filter(x=>x!==id);toast('Voucher dilepas')}else{const m=setV(id);toast(m||'Voucher dipakai')}rerender()}else if(t.hasAttribute('data-coin')){S.useCoin=!S.useCoin;rerender()}else if(t.dataset.q){const [i,d]=t.dataset.q.split(',').map(Number);S.qty[i]=Math.min(99,Math.max(1,(S.qty[i]||1)+d));rerender()}else if(t.dataset.pay){S.pay=PAY[+t.dataset.pay];toast('Metode pembayaran dipilih');go(hist.pop()||'cart',false)}else if(t.dataset.dtab){S.dtab=t.dataset.dtab;rerender()}else if(t.dataset.setmain){S.addr.forEach(a=>a.m=a.id==t.dataset.setmain);toast('Alamat utama diperbarui');rerender()}else if(t.dataset.deladdr){S.addr=S.addr.filter(a=>a.id!=t.dataset.deladdr);toast('Alamat dihapus');rerender()}else if(t.dataset.rm){S.cart.delete(+t.dataset.rm);delete S.qty[+t.dataset.rm];toast('Dihapus dari keranjang');rerender()}else if(t.dataset.like){const k=+t.dataset.like;S.likes.has(k)?S.likes.delete(k):S.likes.add(k);rerender()}else if(t.dataset.ftab){S.ftab=t.dataset.ftab;rerender()}

  else if(f.matches('[data-fld]')){S.u[f.dataset.fld]=f.v.value.trim();toast('Data disimpan');go(hist.pop()||'akun',false)}
  else if(f.matches('[data-vc]')){const code=f.c.value.trim().toUpperCase(),id=Object.keys(VR).find(k=>VR[k].code===code);if(!code){toast('Masukkan kode voucher');return}if(!id){toast('Kode voucher tidak ditemukan');return}if(S.vs.includes(id)){toast('Voucher sudah dipakai');return}const m=setV(id);toast(m||'Voucher berhasil dipakai');rerender()}
  else if(f.matches('[data-book]')){S.bk[f.dataset.id]={n:f.n.value.trim(),h:f.h.value.trim(),e:f.e.value.trim(),k:f.k.value};toast('Booking berhasil');go(hist.pop()||'event',false)}
  else if(f.matches('[data-pw]')){if(f.p.value!==f.q.value){toast('Konfirmasi password tidak sama');return}toast('Password diperbarui');go(hist.pop()||'akun',false)}
  else if(f.matches('[data-addr]')){const old=S.addr.find(x=>x.id==f.dataset.id),m=f.m.checked||!!(old&&old.m)||!S.addr.length;if(m)S.addr.forEach(x=>x.m=false);const d={l:f.l.value,n:f.n.value.trim(),h:f.h.value.trim(),a:f.a.value.trim(),m};if(old)Object.assign(old,d);else S.addr.push({id:Date.now(),...d});toast(old?'Alamat disimpan':'Alamat ditambahkan');go(hist.pop()||'alamat',false)}});
document.addEventListener('change',e=>{if(e.target.id!=='pf'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{S.photo=r.result;$('#pv').innerHTML=`<img src="${S.photo}" alt="">`};r.readAsDataURL(e.target.files[0])});
go('home',false);
</script>
</body>
</html>
